name: Publish Snapshot to Posit Connect

on:
  push:
  branches:
  - main

jobs:
  deploy:
  runs-on: ubuntu-latest

permissions:
  contents: read
id-token: write

steps:
  - name: Checkout repository
uses: actions/checkout@v7

- name: Deploy to Posit Connect
uses: posit-dev/connect-actions/deploy@main